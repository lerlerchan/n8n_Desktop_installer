name: Build and Release

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      n8n_version:
        description: 'n8n version (leave empty for version in package.json)'
        required: false
        default: ''

jobs:
  build-installer:
    runs-on: windows-latest
    outputs:
      n8n_version: ${{ steps.n8n_version.outputs.version }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js 20.x
        uses: actions/setup-node@v4
        with:
          node-version: '20.x'

      - name: Install dependencies
        run: npm install
        env:
          npm_config_build_from_source: false

      - name: Get n8n version
        id: n8n_version
        run: |
          $version = (Get-Content node_modules\n8n\package.json | ConvertFrom-Json).version
          echo "version=$version" >> $env:GITHUB_OUTPUT
          Write-Host "n8n version: $version"

      - name: Verify n8n binary exists
        run: |
          if (Test-Path "node_modules\n8n\bin\n8n.cmd") {
            Write-Host "n8n binary found at node_modules\n8n\bin\n8n.cmd"
          } else {
            Write-Host "n8n binary NOT found"
            exit 1
          }

      - name: Build Windows installer
        run: npm run build:win

      - name: Verify build output
        run: |
          Write-Host "=== dist folder ==="
          if (Test-Path dist) {
            Get-ChildItem dist -Filter *.exe | Select-Object Name, Length
          }
          Write-Host "=== Checking n8n in packaged app ==="
          $n8nBin = "dist\win-unpacked\resources\app\node_modules\n8n\bin\n8n.cmd"
          if (Test-Path $n8nBin) {
            Write-Host "n8n binary found in packaged app"
          } else {
            Write-Host "WARNING: n8n binary NOT found in packaged app"
          }

      - name: Upload installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: windows-installer
          path: dist/*.exe
          retention-days: 7

  release:
    runs-on: ubuntu-latest
    needs: [build-installer]
    permissions:
      contents: write
    steps:
      - name: Download installer artifact
        uses: actions/download-artifact@v4
        with:
          name: windows-installer
          path: ./artifacts

      - name: List downloaded artifacts
        run: |
          echo "=== Downloaded artifacts ==="
          ls -la ./artifacts/

      - name: Rename installer for consistent URL
        run: |
          cd artifacts
          for f in *.exe; do
            if [ -f "$f" ]; then
              mv "$f" "n8n-desktop-setup.exe"
              echo "Renamed $f to n8n-desktop-setup.exe"
              break
            fi
          done

      - name: Delete existing latest release
        run: |
          gh release delete latest --yes --cleanup-tag || true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: n8n Desktop (Latest)
          body: |
            Automated build from main branch.

            **n8n version:** ${{ needs.build-installer.outputs.n8n_version }}
            **Node.js version:** 20.x
            **Platform:** Windows x64

            ## Download
            - **n8n-desktop-setup.exe** - Windows installer (includes bundled n8n)

            ## Direct Download URL
            ```
            https://github.com/${{ github.repository }}/releases/latest/download/n8n-desktop-setup.exe
            ```
          files: |
            artifacts/n8n-desktop-setup.exe
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
