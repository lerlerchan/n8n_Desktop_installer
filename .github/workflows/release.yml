name: Build and Release

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      n8n_version:
        description: 'n8n version (leave empty for latest)'
        required: false
        default: ''

jobs:
  build-runtime:
    runs-on: windows-latest
    outputs:
      n8n_version: ${{ steps.n8n_version.outputs.version }}
    steps:
      - name: Setup Node.js 20.x
        uses: actions/setup-node@v4
        with:
          node-version: '20.x'

      - name: Verify Node environment
        run: |
          node -v
          npm -v

      - name: Create runtime directory structure
        run: |
          mkdir runtime
          cd runtime
          echo '{"name":"n8n-runtime","version":"1.0.0","private":true}' > package.json

      - name: Install n8n and dependencies
        run: |
          cd runtime
          npm install n8n@${{ github.event.inputs.n8n_version || 'latest' }} --save
        env:
          npm_config_build_from_source: false

      - name: Verify n8n binary exists
        run: |
          dir runtime\node_modules\.bin\
          if (Test-Path "runtime\node_modules\.bin\n8n.cmd") {
            Write-Host "n8n.cmd found"
          } else {
            Write-Host "n8n.cmd NOT found"
            exit 1
          }

      - name: Get n8n version
        id: n8n_version
        run: |
          $version = (Get-Content runtime\node_modules\n8n\package.json | ConvertFrom-Json).version
          echo "version=$version" >> $env:GITHUB_OUTPUT
          Write-Host "n8n version: $version"

      - name: Create runtime zip
        run: |
          Compress-Archive -Path runtime\node_modules, runtime\package.json, runtime\package-lock.json -DestinationPath n8n-runtime-win-x64.zip -Force

      - name: Upload runtime artifact
        uses: actions/upload-artifact@v4
        with:
          name: n8n-runtime-win-x64
          path: n8n-runtime-win-x64.zip
          retention-days: 7

  build-installer:
    runs-on: windows-latest
    needs: build-runtime
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js 20.x
        uses: actions/setup-node@v4
        with:
          node-version: '20.x'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci
        env:
          npm_config_optional: false

      - name: Install NSIS
        run: choco install nsis -y

      - name: Build Windows installer
        run: npm run build:win --if-present

      - name: List build output
        run: |
          Write-Host "=== dist folder contents ==="
          if (Test-Path dist) { Get-ChildItem -Recurse dist | Select-Object FullName }

      - name: Upload installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: windows-installer
          path: dist/*.exe
          retention-days: 7

  release:
    runs-on: ubuntu-latest
    needs: [build-runtime, build-installer]
    permissions:
      contents: write
    steps:
      - name: Download runtime artifact
        uses: actions/download-artifact@v4
        with:
          name: n8n-runtime-win-x64
          path: ./artifacts

      - name: Download installer artifact
        uses: actions/download-artifact@v4
        with:
          name: windows-installer
          path: ./artifacts

      - name: List downloaded artifacts
        run: |
          echo "=== Downloaded artifacts ==="
          ls -la ./artifacts/

      - name: Rename installer for consistent URL
        run: |
          cd artifacts
          # Find the .exe file and rename it to a consistent name
          for f in *.exe; do
            if [ -f "$f" ]; then
              mv "$f" "n8n-desktop-setup.exe"
              echo "Renamed $f to n8n-desktop-setup.exe"
              break
            fi
          done

      - name: Delete existing latest release
        run: |
          gh release delete latest --yes --cleanup-tag || true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: n8n Desktop (Latest)
          body: |
            Automated build from main branch.

            **n8n version:** ${{ needs.build-runtime.outputs.n8n_version }}
            **Node.js version:** 20.x
            **Platform:** Windows x64

            ## Downloads
            - **n8n-desktop-setup.exe** - Windows installer
            - **n8n-runtime-win-x64.zip** - Runtime bundle (used by installer)

            ## Direct Download URLs
            ```
            https://github.com/${{ github.repository }}/releases/latest/download/n8n-desktop-setup.exe
            https://github.com/${{ github.repository }}/releases/latest/download/n8n-runtime-win-x64.zip
            ```
          files: |
            artifacts/n8n-runtime-win-x64.zip
            artifacts/n8n-desktop-setup.exe
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
