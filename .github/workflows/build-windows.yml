name: Build Windows installer

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20.x'
          cache: 'npm'

      - name: Verify environment
        run: |
          node -v
          npm -v

      - name: Install dependencies (lightweight shell only)
        run: npm ci
        env:
          # Skip optional dependencies and native module rebuilds
          npm_config_optional: false

      - name: Install NSIS (required by electron-builder)
        run: choco install nsis -y

      - name: Build Windows installer
        run: npm run build:win --if-present

      - name: List build output
        run: |
          Write-Host "=== dist folder contents ==="
          if (Test-Path dist) { Get-ChildItem -Recurse dist | Select-Object FullName }

      - name: Upload installer artifacts
        uses: actions/upload-artifact@v4
        with:
          name: windows-installer
          path: |
            dist/**/*.exe
            dist/**/*
